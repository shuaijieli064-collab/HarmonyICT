<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a8a"/><stop offset="0.6" stop-color="#1d4ed8"/><stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect width="1200" height="860" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="72" fill="url(#hdr)"/>
  <text x="36" y="40" fill="#fff" font-size="24" font-weight="700">NEXUS · 系统架构与华为云产品触点</text>
  <text x="1164" y="39" fill="#dbeafe" font-size="13" text-anchor="end">V2 · 2026-11-24</text>
  <text x="36" y="60" fill="#bfdbfe" font-size="12">个人资料智能管家：上传 → 抽取 → 世界模型 → 风险 → 授权 → 执行</text>

  <!-- 层标签 -->
  <g font-size="12" fill="#94a3b8" font-weight="600">
    <text x="24" y="132">用户层</text>
    <text x="24" y="232">前端 · Next.js 16</text>
    <text x="24" y="390">接入层</text>
    <text x="24" y="498">后端 · Spring Boot 3.3.5</text>
    <text x="24" y="686">华为云产品层</text>
  </g>

  <!-- 用户层 -->
  <g>
    <rect x="140" y="100" width="200" height="52" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="240" y="122" fill="#1e293b" font-size="14" font-weight="600" text-anchor="middle">桌面浏览器</text>
    <text x="240" y="140" fill="#64748b" font-size="11" text-anchor="middle">Chrome / Edge</text>
    <rect x="380" y="100" width="200" height="52" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="480" y="122" fill="#1e293b" font-size="14" font-weight="600" text-anchor="middle">移动端浏览器</text>
    <text x="480" y="140" fill="#64748b" font-size="11" text-anchor="middle">响应式适配</text>
  </g>

  <!-- 前端层 -->
  <rect x="140" y="180" width="920" height="140" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="600" y="204" fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">nexus-frontend · React 19 + TypeScript + Tailwind 4 + Framer Motion + ECharts 6</text>
  <g font-size="12" fill="#1e293b" text-anchor="middle">
    <rect x="160" y="218" width="130" height="44" rx="8" fill="#fff" stroke="#bfdbfe"/><text x="225" y="245">个人驾驶舱 /</text>
    <rect x="302" y="218" width="130" height="44" rx="8" fill="#fff" stroke="#bfdbfe"/><text x="367" y="245">世界模型</text>
    <rect x="444" y="218" width="130" height="44" rx="8" fill="#fff" stroke="#bfdbfe"/><text x="509" y="245">情报中心</text>
    <rect x="586" y="218" width="130" height="44" rx="8" fill="#fff" stroke="#bfdbfe"/><text x="651" y="245">决策实验室</text>
    <rect x="728" y="218" width="130" height="44" rx="8" fill="#fff" stroke="#bfdbfe"/><text x="793" y="245">Agent 中心</text>
    <rect x="870" y="218" width="130" height="44" rx="8" fill="#fff" stroke="#bfdbfe"/><text x="935" y="245">资产中心</text>
  </g>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <rect x="160" y="272" width="270" height="34" rx="8" fill="#fff" stroke="#bfdbfe"/><text x="295" y="294">实体关系图谱（ECharts 力导向）+ 时间线</text>
    <rect x="444" y="272" width="270" height="34" rx="8" fill="#fff" stroke="#bfdbfe"/><text x="579" y="294">风险徽章 + 证据来源 + Mock 开关</text>
    <rect x="728" y="272" width="272" height="34" rx="8" fill="#fff" stroke="#bfdbfe"/><text x="864" y="294">上传两段进度 + L2 授权二次确认</text>
  </g>

  <!-- 接入层 -->
  <rect x="380" y="360" width="440" height="48" rx="10" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="600" y="382" fill="#0f766e" font-size="14" font-weight="600" text-anchor="middle">ECS 公网部署 · nginx 反向代理</text>
  <text x="600" y="399" fill="#115e59" font-size="11" text-anchor="middle">前后端同域 · HTTPS · 健康检查 /actuator/health</text>

  <!-- 后端层 -->
  <rect x="140" y="450" width="920" height="152" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="600" y="474" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="middle">nexus-backend · Java 21 + Spring Security + JWT · 模块化单体 · user_id 数据隔离</text>
  <g font-size="12" fill="#1e293b" text-anchor="middle">
    <rect x="160" y="488" width="172" height="44" rx="8" fill="#fff" stroke="#ddd6fe"/><text x="246" y="515">认证 / 用户</text>
    <rect x="344" y="488" width="172" height="44" rx="8" fill="#fff" stroke="#ddd6fe"/><text x="430" y="515">文件上传 → OBS</text>
    <rect x="528" y="488" width="172" height="44" rx="8" fill="#fff" stroke="#ddd6fe"/><text x="614" y="515">世界模型 CRUD</text>
    <rect x="712" y="488" width="172" height="44" rx="8" fill="#fff" stroke="#ddd6fe"/><text x="798" y="515">风险规则引擎</text>
    <rect x="896" y="488" width="148" height="44" rx="8" fill="#fff" stroke="#ddd6fe"/><text x="970" y="515">Agent L0–L2</text>
  </g>
  <rect x="160" y="544" width="540" height="42" rx="8" fill="#fff" stroke="#ddd6fe"/>
  <text x="430" y="570" fill="#475569" font-size="11" text-anchor="middle">AI Provider 统一封装：OCR + MaaS 抽取结构化事实（模型只解释，不下风险结论）</text>
  <rect x="712" y="544" width="332" height="42" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="878" y="570" fill="#b91c1c" font-size="11" text-anchor="middle">红线：无支付 / 无越权 / L2 显式授权</text>

  <!-- 云产品层 -->
  <rect x="140" y="650" width="920" height="176" rx="14" fill="url(#cloud)" stroke="#fdba74"/>
  <text x="600" y="674" fill="#9a3412" font-size="13" font-weight="700" text-anchor="middle">华为云产品使用清单（评分核心）</text>
  <g font-size="12" fill="#7c2d12" text-anchor="middle">
    <rect x="160" y="688" width="172" height="56" rx="8" fill="#fff" stroke="#fed7aa"/><text x="246" y="710">RDS for PostgreSQL</text><text x="246" y="728" font-size="10" fill="#9a3412">世界模型 9 表持久化</text>
    <rect x="344" y="688" width="172" height="56" rx="8" fill="#fff" stroke="#fed7aa"/><text x="430" y="710">Redis 云服务</text><text x="430" y="728" font-size="10" fill="#9a3412">风险 / 任务状态缓存</text>
    <rect x="528" y="688" width="172" height="56" rx="8" fill="#fff" stroke="#fed7aa"/><text x="614" y="710">OBS 对象存储</text><text x="614" y="728" font-size="10" fill="#9a3412">原始文件与图片</text>
    <rect x="712" y="688" width="172" height="56" rx="8" fill="#fff" stroke="#fed7aa"/><text x="798" y="710">MaaS + OCR</text><text x="798" y="728" font-size="10" fill="#9a3412">结构化抽取</text>
    <rect x="896" y="688" width="148" height="56" rx="8" fill="#fff" stroke="#fed7aa"/><text x="970" y="710">CodeArts</text><text x="970" y="728" font-size="10" fill="#9a3412">代码智能体（必选）</text>
  </g>
  <text x="600" y="786" fill="#9a3412" font-size="11" text-anchor="middle">证据留痕：控制台截图 + 调用日志 + 部署验收 → docs/evidence/cloud/</text>
  <text x="600" y="810" fill="#64748b" font-size="10" text-anchor="middle">本地 dev profile 使用 H2 + mock AI，无云凭据亦可跑通全链路；prod profile 走真实华为云</text>

  <!-- 关键连接线 -->
  <g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M240,152 L240,180"/>
    <path d="M480,152 L480,180"/>
    <path d="M600,320 L600,360"/>
    <path d="M600,408 L600,450"/>
    <path d="M600,602 L600,650"/>
  </g>
  <g stroke="#1d4ed8" stroke-width="1.4" fill="none" marker-end="url(#arrb)" stroke-dasharray="5,4">
    <path d="M140,214 C110,300 110,520 140,560"/>
    <path d="M1060,560 C1090,520 1090,300 1060,214"/>
  </g>
  <text x="112" y="400" fill="#1d4ed8" font-size="10" transform="rotate(-90,112,400)">数据上行：上传/抽取</text>
  <text x="1092" y="400" fill="#1d4ed8" font-size="10" transform="rotate(-90,1092,400)">结果下行：图谱/风险/执行</text>
</svg>
