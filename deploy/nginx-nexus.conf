# NEXUS nginx 站点配置（ECS）
# 安装：sudo cp deploy/nginx-nexus.conf /etc/nginx/sites-available/nexus.conf
#       sudo ln -s /etc/nginx/sites-available/nexus.conf /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# 拓扑（cloud-deployment-plan 3.4）：公网 EIP -> nginx
#   /            -> Next.js (:3000, next start)
#   /api/ 与 /actuator/health -> Spring Boot (:8080)
# 演示阶段若走 EIP:8080 直连后端，可先不启用此文件。

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # 后端 API 反代（同源反代为可选优化，前端仍可用 NEXT_PUBLIC_API_BASE_URL 直连）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 健康检查直通，便于 CodeArts 部署任务的健康新检查
    location /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # 前端 Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
