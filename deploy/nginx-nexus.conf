# NEXUS nginx 站点配置：公网 EIP:80 入口（演示阶段）；如需 443 需域名备案后追加证书
# 安装：sudo cp nginx-nexus.conf /etc/nginx/sites-available/nexus
#       sudo ln -s /etc/nginx/sites-available/nexus /etc/nginx/sites-enabled/nexus
# 拓扑见 docs/cloud-deployment-plan.md 3.4：/api 反代后端 :8080，其余走 Next.js :3000
server {
    listen 80;
    server_name _;

    # 上传接口限制：默认 1M 太小，按资料上传场景放宽到 20M
    client_max_body_size 20m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # 后端 API：保留 Host/真实 IP，便于审计日志定位
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查：公网可直接探测后端状态（与契约 /actuator/health 对齐）
    location /actuator/health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        proxy_set_header Host $host;
    }

    # 前端页面与静态资源
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
