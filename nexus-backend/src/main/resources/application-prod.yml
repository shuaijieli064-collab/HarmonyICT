# 生产环境模板：华为云 RDS PostgreSQL / Redis / OBS
# 部署时通过环境变量或 K8s Secret 注入，禁止把真实凭证提交到仓库（docs/05 安全红线第 3 条）
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${NEXUS_RDS_HOST:127.0.0.1}:${NEXUS_RDS_PORT:5432}/${NEXUS_RDS_DB:nexus}
    username: ${NEXUS_RDS_USER:nexus}
    password: ${NEXUS_RDS_PASSWORD:}
  sql:
    init:
      mode: never
  # 生产用 Flyway 管理 PostgreSQL DDL 版本：基线脚本 db/migration/V1__init.sql
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${NEXUS_REDIS_HOST:127.0.0.1}
      port: ${NEXUS_REDIS_PORT:6379}
      password: ${NEXUS_REDIS_PASSWORD:}

nexus:
  jwt:
    # 生产必须显式注入密钥；未配置时启动直接失败并给出明确提示（fail-fast，禁止回退默认弱密钥）
    secret: ${NEXUS_JWT_SECRET:?NEXUS_JWT_SECRET 必须配置且至少 32 字节}
  # 生产环境文件存储走华为云 OBS（本地联调用 local 磁盘实现）
  storage:
    type: obs
  obs:
    endpoint: ${NEXUS_OBS_ENDPOINT:https://obs.cn-north-4.myhuaweicloud.com}
    bucket: ${NEXUS_OBS_BUCKET:nexus-demo}
    # AK/SK 只走环境变量（规范 2.4 红线），部署时由云上凭据管理注入
    access-key: ${NEXUS_OBS_AK:}
    secret-key: ${NEXUS_OBS_SK:}
  # 前端跨域来源，逗号分隔；未配置时回退 SecurityConfig 默认 localhost（本地联调兜底）
  cors:
    origins: ${NEXUS_CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
  ai:
    # 显式声明真实调用：生产必须切 real，禁止用 mock 交付（cloud-deployment-plan 5.4）
    mode: real
    maas:
      base-url: ${NEXUS_AI_MAAS_BASE_URL:https://api.modelarts-maas.com}
      # 新旧端点 path 不同：新版 /v2/chat/completions，旧区域域名 /v1/chat/completions
      completion-path: ${NEXUS_AI_MAAS_COMPLETION_PATH:/v2/chat/completions}
      api-key: ${NEXUS_AI_MAAS_API_KEY:}
      model: ${NEXUS_AI_MAAS_MODEL:}
      temperature: ${NEXUS_AI_MAAS_TEMPERATURE:0.1}
    ocr:
      iam-endpoint: ${NEXUS_AI_OCR_IAM_ENDPOINT:https://iam.cn-north-4.myhuaweicloud.com}
      endpoint: ${NEXUS_AI_OCR_ENDPOINT:https://ocr.cn-north-4.myhuaweicloud.com}
      username: ${NEXUS_AI_OCR_USERNAME:}
      password: ${NEXUS_AI_OCR_PASSWORD:}
      domain-name: ${NEXUS_AI_OCR_DOMAIN_NAME:}
      project-id: ${NEXUS_AI_OCR_PROJECT_ID:}

management:
  health:
    redis:
      enabled: true
