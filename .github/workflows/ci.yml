name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        run: mvn -q -f nexus-backend/pom.xml test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nexus-frontend/package-lock.json
      - name: Install, build and lint
        run: npm ci && npm run build && npm run lint
